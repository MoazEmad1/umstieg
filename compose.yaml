name: umstieg

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umstieg}
      POSTGRES_USER: ${POSTGRES_USER:-umstieg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  collector:
    image: ghcr.io/moazemad1/umstieg-collector:${COLLECTOR_TAG:-latest}
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    profiles: [collector]
    environment:
      FEED_USER_AGENT: ${FEED_USER_AGENT:?set FEED_USER_AGENT in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data/raw:/data/raw
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "5"

  sync:
    image: rclone/rclone:1.75.2
    profiles: [sync]
    environment:
      RCLONE_CONFIG_ARCHIVE_TYPE: s3
      RCLONE_CONFIG_ARCHIVE_PROVIDER: ${ARCHIVE_PROVIDER:-Hetzner}
      RCLONE_CONFIG_ARCHIVE_REGION: ${ARCHIVE_REGION:-fsn1}
      RCLONE_CONFIG_ARCHIVE_ENDPOINT: ${ARCHIVE_ENDPOINT:-https://fsn1.your-objectstorage.com}
      RCLONE_CONFIG_ARCHIVE_ACCESS_KEY_ID: ${ARCHIVE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_ARCHIVE_SECRET_ACCESS_KEY: ${ARCHIVE_SECRET_ACCESS_KEY:-}
      ARCHIVE_BUCKET: ${ARCHIVE_BUCKET:-}
      ARCHIVE_KEEP_LOCAL: ${ARCHIVE_KEEP_LOCAL:-168h}
    volumes:
      - ./data/raw:/data/raw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        test -n "$$ARCHIVE_BUCKET"
        rclone copy /data/raw "archive:$$ARCHIVE_BUCKET/raw" --immutable --min-age 5m --exclude "*.tmp" --stats-one-line -v
        rclone move /data/raw "archive:$$ARCHIVE_BUCKET/raw" --immutable --min-age "$$ARCHIVE_KEEP_LOCAL" --exclude "*.tmp" --stats-one-line -v

volumes:
  pgdata:
  kafkadata:
