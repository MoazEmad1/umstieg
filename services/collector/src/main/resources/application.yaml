spring:
  application:
    name: collector

collector:
  user-agent: ${FEED_USER_AGENT:}
  data-dir: ${COLLECTOR_DATA_DIR:data/raw}
  sources:
    - name: staging
      url: https://staging.gtfsrt.vbb.de/data
      interval: 60s
    - name: production
      url: https://production.gtfsrt.vbb.de/data
      interval: 60s
